[workspace]
resolver = "3"
members = ["minirtos"]

[package]
name = "minirtos-app"
version = "0.1.0"
edition = "2024"

[features]
default = ["pico2w-52pi"]

pico2w-ws-lcd114 = []
pico2w-52pi = []
pico2w-picocalc = []
cyw43 = []

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

rp235x-hal = { version = "0.4", default-features = false, features = [
    "critical-section-impl",
] }

rp235x-pac = "0.2"

rp-binary-info = "0.1"

heapless = "0.9"

embedded-graphics = "0.8"

smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
    "auto-icmp-echo-reply",
] }

pio = "0.3"

linked_list_allocator = "0.10"

[profile.dev]
debug = 2
debug-assertions = true
opt-level = 2
overflow-checks = true
