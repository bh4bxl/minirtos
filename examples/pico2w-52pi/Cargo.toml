[package]
name = "pico2w-52pi"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

rp235x-pac = "0.2"

rp235x-hal = { version = "0.4", default-features = false, features = [
    "critical-section-impl",
] }

rp-binary-info = "0.1"

minirtos-abi = { path = "../../abi" }
minirtos-kernel = { path = "../../kernel", features = ["defmt"] }
minirtos-drivers = { path = "../../drivers" }
minirtos-services = { path = "../../services" }
